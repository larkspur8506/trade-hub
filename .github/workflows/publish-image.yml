name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build & push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 假绿守卫：镜像推成功不算数，必须用默认 CMD 真起一次并探活 /health。
      - name: Smoke test the published image (default CMD + /health)
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tags }}"
          tag="${tag%%$'\n'*}"
          echo "verifying $tag"
          docker pull "$tag"
          docker run -d --name trade-hub-smoke \
            -e HUB_TOKEN=smoke-token -e HUB_HL_TOKEN=smoke-hl -e HUB_POLL_S=0 \
            -p 8120:8120 "$tag"
          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8120/health | grep -q '"ok":true'; then ok=1; break; fi
            sleep 2
          done
          docker logs trade-hub-smoke || true
          docker rm -f trade-hub-smoke >/dev/null
          [ -n "$ok" ] || { echo "smoke failed"; exit 1; }
          echo "smoke ok"
